<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--band); color: var(--band-text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 440px; width: 520px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 520px; height: 288px; }
  .grid { fill: none; stroke: rgba(232,236,241,.06); stroke-width: 1; }
  .part { fill: #14171d; stroke: #e8ecf1; stroke-width: 1.5; }
  .dim { stroke: #48515e; stroke-width: 1; fill: none; }
  .lead { stroke: var(--accent); stroke-width: 1.2; fill: none; }
  .mark { fill: var(--accent); }
  .mtext { fill: var(--on-accent); font: 600 11px var(--font-mono); }
  .dtext { fill: #9aa5b4; font: 11px var(--font-mono); }
  .words { position: absolute; left: var(--s-6); bottom: var(--s-6); max-width: 420px; }
  .name { margin: 0; font-size: 84px; line-height: .92; font-weight: 560; letter-spacing: -0.035em; }
  .tag { margin: var(--s-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--band-text-2); }
</style>
</head>
<body>
<div class="cover" data-theme="dark" data-accent="copper">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 520 288" width="520" height="288">
<!--
  ground      band with the 16px drawing grid, as behind every Meridian drawing
  blocks      one connector panel drawn as a part (draw-fill on band) bled off the right edge, with two D-sub shells and an LED column
  pattern     the signature: three accent leaders drop from the parts to three markers J1, J2, D1, the only accent on the cover
  scales      grid 16; panel radius 6 (r-3); markers 32x18 radius 2 (r-1); dimension line on top as in a drawing
-->
<defs><pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0H0V16"/></pattern></defs>
<rect width="520" height="288" fill="url(#g)"/>
<path class="dim" d="M96 40H560M96 32v16"/><text class="dtext" x="104" y="28">105.0</text>
<rect class="part" x="96" y="64" width="480" height="128" rx="6"/>
<path class="part" d="M140 108h76l-7 40h-62z"/><path class="part" d="M260 108h76l-7 40h-62z"/>
<circle class="part" cx="130" cy="128" r="4"/><circle class="part" cx="226" cy="128" r="4"/><circle class="part" cx="250" cy="128" r="4"/><circle class="part" cx="346" cy="128" r="4"/>
<circle class="mark" cx="420" cy="96" r="5"/><circle class="part" cx="420" cy="116" r="5"/><circle class="part" cx="420" cy="136" r="5"/><circle class="part" cx="420" cy="156" r="5"/>
<path class="lead" d="M178 148V224M298 148V224M420 161V224"/>
<rect class="mark" x="162" y="224" width="32" height="18" rx="2"/><text class="mtext" x="178" y="237" text-anchor="middle">J1</text>
<rect class="mark" x="282" y="224" width="32" height="18" rx="2"/><text class="mtext" x="298" y="237" text-anchor="middle">J2</text>
<rect class="mark" x="404" y="224" width="32" height="18" rx="2"/><text class="mtext" x="420" y="237" text-anchor="middle">D1</text>
</svg>
</div>
<div class="words">
<h1 class="name">Meridian</h1>
<p class="tag">Company sites for electronics makers. Specifications first.</p>
</div>
</div>
</body>
</html>
