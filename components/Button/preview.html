<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body class="md-doc">
<div id="root">
<div class="md-matrix">
<span></span><span class="h">Default</span><span class="h">Hover</span><span class="h">Pressed</span><span class="h">Focus</span><span class="h">Disabled</span><span class="h">Loading</span>
<span class="h">Primary</span>
<button class="md-btn md-btn-primary" type="button">Request quote</button><button class="md-btn md-btn-primary is-hover" type="button">Request quote</button><button class="md-btn md-btn-primary is-active" type="button">Request quote</button><button class="md-btn md-btn-primary is-focus" type="button">Request quote</button><button class="md-btn md-btn-primary" type="button" disabled>Request quote</button><button class="md-btn md-btn-primary" type="button" aria-busy="true"><span class="md-spin"></span>Sending</button>
<span class="h">Secondary</span>
<button class="md-btn md-btn-secondary" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-download"/></svg>Datasheet</button><button class="md-btn md-btn-secondary is-hover" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-download"/></svg>Datasheet</button><button class="md-btn md-btn-secondary is-active" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-download"/></svg>Datasheet</button><button class="md-btn md-btn-secondary is-focus" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-download"/></svg>Datasheet</button><button class="md-btn md-btn-secondary" type="button" disabled><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-download"/></svg>Datasheet</button><button class="md-btn md-btn-secondary" type="button" aria-busy="true"><span class="md-spin"></span>Preparing</button>
<span class="h">Tertiary</span>
<button class="md-btn md-btn-tertiary" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-compare"/></svg>Compare</button><button class="md-btn md-btn-tertiary is-hover" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-compare"/></svg>Compare</button><button class="md-btn md-btn-tertiary is-active" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-compare"/></svg>Compare</button><button class="md-btn md-btn-tertiary is-focus" type="button"><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-compare"/></svg>Compare</button><button class="md-btn md-btn-tertiary" type="button" disabled><svg class="md-i md-i-16" aria-hidden="true"><use href="#i-compare"/></svg>Compare</button><span></span>
<span class="h">Sizes</span>
<button class="md-btn md-btn-primary md-btn-s" type="button">Small 32</button><button class="md-btn md-btn-primary" type="button">Medium 40</button><button class="md-btn md-btn-primary md-btn-l" type="button">Large 48</button><span></span><span></span><span></span>
</div>
</div>
<script>Meridian.mount();</script>
</body>
</html>
